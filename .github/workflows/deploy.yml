name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:  # Enables manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/miracall.net/callmiracle
            
            # Exit on any error
            set -e
            
            # Fix git ownership issue permanently
            echo "Current user: $(whoami)"
            echo "Groups: $(groups)"
            echo "Repository ownership:"
            ls -la /var/www/miracall.net/callmiracle/.git/ | head -5
            
            # Configure git safe directory first
            echo "Configuring git safe directory..."
            git config --global --add safe.directory /var/www/miracall.net/callmiracle || true
            
            # Try to fix ownership without sudo (if user is in www-data group)
            if groups | grep -q www-data; then
              echo "User is in www-data group, attempting to fix permissions..."
              # Make .git directory writable by group
              chmod -R g+w /var/www/miracall.net/callmiracle/.git || echo "Could not change permissions"
            else
              echo "User not in www-data group, checking if git operations work..."
            fi
            
            # Test if git operations work
            echo "Testing git status..."
            if ! git status >/dev/null 2>&1; then
              echo "Git operations still failing. Repository needs manual ownership fix."
              echo "Please run on server: sudo chown -R $(whoami):www-data /var/www/miracall.net/callmiracle"
              exit 1
            fi
            
            # Pull latest changes
            echo "Pulling latest changes..."
            git pull
            
            echo "Installing dependencies..."
            yarn install
            
            echo "Building containers..."
            docker compose build
            
            echo "Starting services..."
            docker compose up -d
            
            echo "Deployment completed successfully"