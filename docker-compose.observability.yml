version: '3.8'

networks:
  observability:
    driver: bridge

volumes:
  grafana-storage:
  tempo-data:
  loki-data:
  prometheus-data:

services:
  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: callmiracle-grafana
    ports:
      - "127.0.0.1:3004:3000"
    env_file:
      - .env.observability
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - observability
    restart: unless-stopped

  # Tempo - Distributed Tracing
  tempo:
    image: grafana/tempo:latest
    container_name: callmiracle-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # tempo
      #- "4317:4317"   # otlp grpc, we're using otel collector on this port
      #- "4318:4318"   # otlp http
      #- "9411:9411"   # zipkin, this is for debugging?
    networks:
      - observability
    restart: unless-stopped

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: callmiracle-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - observability
    restart: unless-stopped

  # OTEL Collector (for better telemetry collection)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: callmiracle-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "127.0.0.1:8888:8888"   # Prometheus metrics
      - "127.0.0.1:8889:8889"   # Prometheus metrics exporter
    networks:
      - observability
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  # Prometheus Server (for Grafana queries)
  prometheus:
    image: prom/prometheus:latest
    container_name: callmiracle-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - observability
    depends_on:
      - otel-collector
    restart: unless-stopped 