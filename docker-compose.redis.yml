version: '3.8'

networks:
  redis-network:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: callmiracle-redis
    ports:
      - "127.0.0.1:6379:6379"  # Only bind to localhost interface
    networks:
      - redis-network
    restart: unless-stopped
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf

volumes:
  redis_data:
    driver: local