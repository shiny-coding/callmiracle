version: '3.8'

networks:
  redis-network:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: callmiracle-redis
    ports:
      - "6379:6379"
    networks:
      - redis-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Optional: Redis configuration
    # volumes:
    #   - ./redis.conf:/usr/local/etc/redis/redis.conf
    #   - redis_data:/data
    # command: redis-server /usr/local/etc/redis/redis.conf

volumes:
  redis_data:
    driver: local