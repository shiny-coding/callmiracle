version: '3.8'

networks:
  app-network:
    driver: bridge
  observability:
    external: true
    name: callmiracle_observability
  redis-network:
    external: true
    name: callmiracle_redis-network

# Reusable configuration template
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    network: host
  env_file:
    - .env.local
    - .env.observability
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - app-network
    - observability
    - redis-network
  volumes:
    - ./logs:/app/logs
  restart: unless-stopped

# Common environment variables
x-common-env: &common-env
  NODE_ENV: production
  REDIS_HOST: callmiracle-redis
  REDIS_PORT: 6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://callmiracle-otel-collector:4318
  LOKI_HOST: http://callmiracle-loki:3100
  MONGODB_URI: mongodb://host.docker.internal:27017/callmiracle
  SERVER_COUNT: 3

services:
  # App instances with shared configuration
  app1:
    <<: *app-common
    environment:
      <<: *common-env
      SERVER_ID: 1

  app2:
    <<: *app-common
    environment:
      <<: *common-env
      SERVER_ID: 2

  app3:
    <<: *app-common
    environment:
      <<: *common-env
      SERVER_ID: 3

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "3003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped