version: '3.8'

networks:
  app-network:
    driver: bridge
  observability:
    external: true
    name: callmiracle_observability

# Reusable configuration template
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    network: host
  environment: &app-env
    - NODE_ENV=production
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://callmiracle-otel-collector:4318
    - LOKI_HOST=http://callmiracle-loki:3100
    - MONGODB_URI=mongodb://host.docker.internal:27017/callmiracle
  env_file:
    - .env.local
    - .env.observability
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - app-network
    - observability
  volumes:
    - ./logs:/app/logs
  restart: unless-stopped
  depends_on:
    - redis

services:
  # Redis for shared pubsub
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # App instances with shared configuration
  app1:
    <<: *app-common
    environment:
      <<: *app-env
      - SERVER_ID=1

  app2:
    <<: *app-common
    environment:
      <<: *app-env
      - SERVER_ID=2

  app3:
    <<: *app-common
    environment:
      <<: *app-env
      - SERVER_ID=3

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "3003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

volumes:
  redis_data: