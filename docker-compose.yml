version: '3.8'

networks:
  app-network:
    driver: bridge
  observability:
    external: true
    name: observability
  redis-network:
    external: true
    name: callmiracle_redis-network
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    ports:
      - "127.0.0.1:3003:3000"
    # Load all environment variables from .env.local file for runtime
    env_file:
      - .env.local
      - .env.observability
    environment:
      # Override for production deployment
      - NODE_ENV=production
      # Override observability endpoints for container networking
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - LOKI_HOST=http://loki:3100
      # MongoDB connection to host machine
      - MONGODB_URI=mongodb://host.docker.internal:27017/callmiracle
      # Redis connection to container
      - REDIS_HOST=callmiracle-redis
      # Server count (single server deployment)
      - SERVER_COUNT=1
    # Enable connection to host machine services  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
      - observability
      - redis-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
