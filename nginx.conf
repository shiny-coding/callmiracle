events {
    worker_connections 1024;
}

http {
    upstream callmiracle_backend {
        # Round-robin load balancing by default
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    # Upstream for specific server selection
    upstream server1 {
        server app1:3000;
    }
    
    upstream server2 {
        server app2:3000;
    }
    
    upstream server3 {
        server app3:3000;
    }

    # Map for server selection based on cookie
    map $cookie_preferred_server $backend_pool {
        default callmiracle_backend;
        "1" server1;
        "2" server2;
        "3" server3;
    }

    server {
        listen 80;
        server_name localhost;

        # Enable large client headers for GraphQL
        large_client_header_buffers 4 16k;
        client_max_body_size 10M;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Health check endpoint
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main application routing
        location / {
            # Choose backend based on preferred server cookie
            proxy_pass http://$backend_pool;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket and SSE support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for long-running connections (GraphQL subscriptions)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            
            # Disable buffering for real-time data
            proxy_buffering off;
            proxy_cache off;
        }

    }
}