global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape CallMiracle metrics from OTEL Collector
  - job_name: 'callmiracle'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8889']
    metric_relabel_configs:
      # Preserve all existing labels
      - source_labels: [__name__]
        target_label: __name__

  # Scrape OTEL Collector internal metrics
  - job_name: 'otel-collector'
    scrape_interval: 30s
    static_configs:
      - targets: ['otel-collector:8888']