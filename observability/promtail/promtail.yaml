server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: callmiracle-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: callmiracle
          service: callmiracle
          __path__: /app/logs/*.log
    
    # Parse structured JSON logs
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            userId: userId
            userName: userName
            requestId: requestId
            path: path
            userAgent: userAgent
            ip: ip
      
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
      
      - labels:
          level:
          service:
          userId:
          path:
      
      - output:
          source: message

  - job_name: callmiracle-error-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: callmiracle-errors
          service: callmiracle
          level: error
          __path__: /app/logs/error-*.log
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            userId: userId
            userName: userName
            requestId: requestId
            path: path
            stack: stack
      
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'
      
      - labels:
          level:
          service:
          userId:
          path:
      
      - output:
          source: message 