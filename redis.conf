# Redis configuration optimized for pub/sub
# Basic settings - Docker network binding (protected by Docker networking)
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 60

# Security - Network isolation only (no password required)
# Protected mode disabled since we're using Docker network isolation
protected-mode no

# ACL Configuration (Redis 6.0+)  
# Use default user with no password since Redis is network-isolated
user default on nopass sanitize-payload ~* &* +@all

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_b83fb23c93bc1e4f8a6e7e4c8a2b0d7c"

# Network optimizations
tcp-backlog 511

# Memory and persistence
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# Client output buffer limits for pub/sub clients (CRITICAL for performance)
# Format: client-output-buffer-limit <class> <hard limit> <soft limit> <soft seconds>
# Official Redis docs recommend these values for pub/sub
client-output-buffer-limit pubsub 32mb 8mb 60
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60

# Performance optimizations
slowlog-log-slower-than 10000
hz 10

# Logging configuration for debugging pub/sub performance
# loglevel debug
logfile /data/redis.log
syslog-enabled yes
syslog-ident redis

# Enable command logging for pub/sub debugging
# This will log all commands including PUBLISH/SUBSCRIBE
slowlog-log-slower-than 1000
slowlog-max-len 1000

# Enable latency monitoring
latency-monitor-threshold 100

# Network debugging - log client connections
# (Note: These are custom settings that help with debugging)
# Log all client connections and disconnections
tcp-keepalive 30